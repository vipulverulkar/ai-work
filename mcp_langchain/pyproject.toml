[tool.setuptools]
py-modules = ["server", "client", "agent_example"]

[project]
name = "mcp-langchain-weather"
version = "0.1.0"
description = "MCP weather + web-search server built with LangChain 1.0"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "mcp>=1.0.0",
  "langchain>=1.0.0",
  "langchain-core>=1.0.0",
  "langchain-community>=0.3.0",
  "langchain-mcp-adapters>=0.1.0",
  "langgraph>=1.0.0",
  "httpx>=0.27.0",
  "ddgs>=9.0.0",
  "python-dotenv>=1.0.0",
]
